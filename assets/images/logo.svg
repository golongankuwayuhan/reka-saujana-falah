<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" fill="none">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark (Hexagonal Futuristic Cyber Prism) -->
  <g transform="translate(10, 10)">
    <!-- Ambient glow backplate -->
    <path d="M50 8 L88 30 L88 74 L50 96 L12 74 L12 30 Z" 
          stroke="url(#neonGrad)" stroke-width="1.5" fill="none" opacity="0.4" />
    
    <!-- Outer Cyber Hex Shield -->
    <path d="M50 14 L82 33 L82 71 L50 90 L18 71 L18 33 Z" 
          stroke="url(#neonGrad)" stroke-width="2.5" fill="#0A0F1D" filter="url(#neonGlow)"/>

    <!-- Dynamic Interior Geometry (R-S-F Vertex Horizon & Controller Angle) -->
    <path d="M30 65 L50 25 L70 65 L50 50 Z" 
          fill="url(#neonGrad)" opacity="0.9"/>
    
    <circle cx="50" cy="50" r="3.5" fill="#00F0FF" />
    <circle cx="30" cy="65" r="2.5" fill="#8B5CF6" />
    <circle cx="70" cy="65" r="2.5" fill="#00F0FF" />
    
    <!-- Code bracket accents -->
    <path d="M26 38 L34 32" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
    <path d="M74 38 L66 32" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
    <path d="M42 78 L58 78" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Typography: REKA SAUJANA FALAH -->
  <g transform="translate(120, 0)">
    <!-- Primary Company Name -->
    <text x="0" y="58" font-family="'Space Grotesk', 'Rajdhani', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="32" font-weight="800" letter-spacing="1" fill="#FFFFFF">
      REKA <tspan fill="url(#neonGrad)">SAUJANA</tspan> FALAH
    </text>
    
    <!-- Tagline / Subtitle -->
    <text x="2" y="85" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="11.5" font-weight="600" letter-spacing="2.8" fill="#94A3B8">
      GAME SYSTEMS &amp; SOFTWARE ENGINEERING
    </text>

    <!-- Technical Status Bar Accent -->
    <rect x="2" y="98" width="160" height="2" fill="url(#neonGrad)" rx="1"/>
    <circle cx="172" cy="99" r="2" fill="#00F0FF"/>
  </g>
</svg>
